# Local development stack: the API plus a PostgreSQL instance.
# AWS S3 and the Claude API are external services — configure real
# credentials in your local ".env" (copied from ".env.example").
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentineliq
      POSTGRES_PASSWORD: sentineliq
      POSTGRES_DB: sentineliq
    ports:
      - "5432:5432"
    volumes:
      - sentineliq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentineliq"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://sentineliq:sentineliq@postgres:5432/sentineliq
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sentineliq_pgdata:
