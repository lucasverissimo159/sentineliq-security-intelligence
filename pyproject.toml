[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentineliq"
version = "0.1.0"
description = "AI-powered security log intelligence platform: ingests network/security logs, stores them in PostgreSQL, archives raw batches to AWS S3, and uses the Claude API to summarize incidents and detect anomalies in natural language."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas" }]
keywords = ["security", "log-analysis", "aws", "claude", "anthropic", "postgresql", "fastapi", "hexagonal-architecture"]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "boto3>=1.34,<2.0",
    "anthropic>=0.34,<1.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.0,<27.0",
    "prometheus-fastapi-instrumentator>=7.0,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "aiosqlite>=0.20,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentineliq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv-check", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` as an argument default is the documented,
# idiomatic pattern (see interfaces/api/dependencies.py) — not a real bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
