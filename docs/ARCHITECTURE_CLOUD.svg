<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071528" />
      <stop offset="1" stop-color="#111b3a" />
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3fc" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc" />
    </marker>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #eefaff; }
      .subtitle { font: 500 14px Arial, sans-serif; fill: #b8c9e8; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #eefaff; }
      .label { font: 600 12px Arial, sans-serif; fill: #eefaff; }
      .small { font: 400 11px Arial, sans-serif; fill: #b8c9e8; }
      .thin { font: 400 10px Arial, sans-serif; fill: #dbeafe; }
      .layer { fill: rgba(40, 67, 118, 0.72); stroke: #8b5cf6; stroke-width: 1.5; }
      .client { fill: rgba(18, 56, 95, 0.80); stroke: #67e8f9; stroke-width: 1.5; }
      .domain { fill: rgba(65, 36, 70, 0.84); stroke: #f8b4d9; stroke-width: 1.5; }
      .app { fill: rgba(18, 101, 91, 0.76); stroke: #86efac; stroke-width: 1.5; }
      .infra { fill: rgba(60, 41, 95, 0.84); stroke: #bfdbfe; stroke-width: 1.5; }
      .arrow { stroke: url(#line); stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-dasharray: 4 4; animation: dash 900ms linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -12; } }
      .pulse { animation: pulse 1600ms ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.65; } }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- background decorative cloud icons -->
  <g opacity="0.25">
    <path d="M120 120C132 103 154 105 165 119C175 119 186 124 187 136C207 135 222 150 218 169C213 184 198 188 184 184C177 194 167 194 160 188C151 197 133 195 127 186C115 187 105 181 105 171C105 162 112 158 120 160C120 144 116 135 120 120Z" fill="#7dd3fc" />
    <path d="M1220 90C1232 73 1254 75 1265 89C1275 89 1286 94 1287 106C1307 105 1322 120 1318 139C1313 154 1298 158 1284 154C1277 164 1267 164 1260 158C1251 167 1233 165 1227 156C1215 157 1205 151 1205 141C1205 132 1212 128 1220 130C1220 114 1216 105 1220 90Z" fill="#a78bfa" />
  </g>

  <text x="60" y="60" class="title">SentinelIQ Architecture</text>
  <text x="60" y="90" class="subtitle">AI security log intelligence pipeline</text>

  <!-- client layer -->
  <rect x="60" y="140" width="210" height="320" rx="20" class="client" filter="url(#shadow)" />
  <text x="85" y="175" class="box-title">Client / Operator</text>
  <ellipse cx="150" cy="240" rx="50" ry="54" fill="#09203d" stroke="#67e8f9" />
  <text x="130" y="238" class="label">API</text>
  <text x="126" y="259" class="label">Client</text>
  <text x="95" y="315" class="small">Security analyst</text>
  <text x="95" y="335" class="small">or automation</text>
  <text x="95" y="355" class="small">service</text>
  <text x="90" y="390" class="thin">POST /logs</text>
  <text x="90" y="410" class="thin">POST /alerts/analyze</text>
  <text x="90" y="430" class="thin">POST /reports/generate</text>

  <!-- API layer -->
  <rect x="310" y="140" width="260" height="320" rx="20" class="layer" filter="url(#shadow)" />
  <text x="335" y="175" class="box-title">API Layer</text>
  <rect x="335" y="210" width="210" height="44" rx="8" fill="#0ea5e9" stroke="#7dd3fc" />
  <text x="353" y="238" class="label">FastAPI Routers</text>
  <text x="353" y="260" class="small">/logs · /alerts · /reports</text>

  <rect x="335" y="270" width="210" height="58" rx="8" fill="#164e63" stroke="#2dd4bf" />
  <text x="353" y="295" class="label">Health + Root + UI</text>
  <text x="353" y="318" class="small">/health · / · /ui</text>

  <rect x="335" y="340" width="210" height="84" rx="8" fill="#312e81" stroke="#a78bfa" />
  <text x="353" y="366" class="label">Dependencies</text>
  <text x="353" y="388" class="small">Ports → Adapters</text>
  <text x="353" y="408" class="small">PostgreSQL / S3 / Claude</text>

  <!-- app layer -->
  <rect x="620" y="140" width="280" height="320" rx="20" class="app" filter="url(#shadow)" />
  <text x="645" y="175" class="box-title">Application Layer</text>
  <rect x="645" y="210" width="230" height="44" rx="8" fill="#14532d" stroke="#86efac" />
  <text x="665" y="238" class="label">IngestLogsUseCase</text>
  <rect x="645" y="270" width="230" height="44" rx="8" fill="#166534" stroke="#86efac" />
  <text x="665" y="298" class="label">AnalyzeLogsUseCase</text>
  <rect x="645" y="330" width="230" height="44" rx="8" fill="#166534" stroke="#86efac" />
  <text x="665" y="358" class="label">GenerateReportUseCase</text>

  <!-- domain layer -->
  <rect x="950" y="140" width="210" height="320" rx="20" class="domain" filter="url(#shadow)" />
  <text x="975" y="175" class="box-title">Domain Layer</text>
  <text x="975" y="218" class="label">Entities</text>
  <text x="975" y="242" class="small">LogEntry</text>
  <text x="975" y="264" class="small">ThreatAlert</text>
  <text x="975" y="286" class="small">AnalysisReport</text>
  <text x="975" y="320" class="label">Value Objects</text>
  <text x="975" y="344" class="small">Severity</text>
  <text x="975" y="376" class="label">Exceptions</text>
  <text x="975" y="400" class="small">DomainError</text>

  <!-- infra layer -->
  <rect x="1210" y="140" width="280" height="320" rx="20" class="infra" filter="url(#shadow)" />
  <text x="1235" y="175" class="box-title">Infrastructure</text>
  <rect x="1235" y="210" width="230" height="44" rx="8" fill="#312e81" stroke="#a78bfa" />
  <text x="1255" y="238" class="label">PostgreSQL Repository</text>
  <rect x="1235" y="270" width="230" height="44" rx="8" fill="#14532d" stroke="#86efac" />
  <text x="1255" y="298" class="label">AWS S3 Adapter</text>
  <rect x="1235" y="330" width="230" height="44" rx="8" fill="#7c2d12" stroke="#fdba74" />
  <text x="1255" y="358" class="label">Anthropic Claude Adapter</text>

  <!-- arrows -->
  <line x1="270" y1="265" x2="310" y2="265" class="arrow" />
  <line x1="570" y1="265" x2="620" y2="265" class="arrow" />
  <line x1="900" y1="265" x2="950" y2="265" class="arrow" />
  <line x1="1160" y1="265" x2="1210" y2="265" class="arrow" />

  <!-- lower process ribbon -->
  <rect x="60" y="530" width="1430" height="220" rx="14" fill="rgba(30,41,63,0.72)" stroke="#8b5cf6" />
  <text x="90" y="570" class="box-title">Workflow</text>
  <text x="90" y="612" class="small">1. Receive log batch from client</text>
  <text x="90" y="635" class="small">2. Ship payload through FastAPI and dependency injection</text>
  <text x="90" y="658" class="small">3. Persist in PostgreSQL and archive raw payload in S3</text>
  <text x="90" y="681" class="small">4. Analyze stream with Claude and materialize alerts/reports</text>

  <g class="pulse">
    <circle cx="600" cy="640" r="4" fill="#7dd3fc" />
    <circle cx="760" cy="640" r="4" fill="#86efac" />
    <circle cx="920" cy="640" r="4" fill="#fdba74" />
    <circle cx="1080" cy="640" r="4" fill="#a78bfa" />
  </g>

</svg>
