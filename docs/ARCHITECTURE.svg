<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 11px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .light { fill: #eef6ff; stroke: #2463eb; stroke-width: 1.5; }
      .app { fill: #eafaf2; stroke: #16a34a; stroke-width: 1.5; }
      .domain { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
      .infra { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
      .ui { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#2563eb" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff" />

  <text x="44" y="48" class="title">SentinelIQ</text>
  <text x="44" y="74" class="subtitle">Security log intelligence platform</text>

  <!-- Main left user/client -->
  <rect x="40" y="110" width="180" height="400" rx="10" class="ui" />
  <text x="60" y="140" class="section-title">Clients</text>
  <circle cx="130" cy="190" r="35" fill="#dbeafe" stroke="#2563eb" />
  <text x="118" y="186" class="label">API</text>
  <text x="114" y="210" class="label">Client</text>
  <text x="60" y="260" class="box-text">Security analyst</text>
  <text x="60" y="282" class="box-text">or automated</text>
  <text x="60" y="304" class="box-text">integration</text>

  <!-- API Layer -->
  <rect x="250" y="110" width="250" height="400" rx="10" class="app" />
  <text x="270" y="140" class="section-title">API Layer</text>
  <rect x="270" y="170" width="210" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="285" y="196" class="box-title">FastAPI Routers</text>
  <text x="285" y="220" class="small">/logs · /alerts · /reports</text>

  <rect x="270" y="235" width="210" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="285" y="260" class="box-title">Health + Root + UI</text>
  <text x="285" y="280" class="small">/health · / · /ui</text>

  <rect x="270" y="315" width="210" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="285" y="340" class="box-title">Dependencies</text>
  <text x="285" y="360" class="small">Ports → Adapters</text>
  <text x="285" y="380" class="small">PostgreSQL / S3 / Claude</text>

  <!-- Use cases layer -->
  <rect x="535" y="110" width="250" height="400" rx="10" class="app" />
  <text x="555" y="140" class="section-title">Application Layer</text>
  <rect x="555" y="170" width="210" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="570" y="196" class="box-title">IngestLogs</text>
  <rect x="555" y="225" width="210" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="570" y="251" class="box-title">AnalyzeLogs</text>
  <rect x="555" y="280" width="210" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="570" y="306" class="box-title">GenerateReport</text>

  <rect x="555" y="340" width="210" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="570" y="365" class="box-title">Ports</text>
  <text x="570" y="386" class="small">LogRepositoryPort</text>
  <text x="570" y="406" class="small">AlertRepositoryPort</text>
  <text x="570" y="424" class="small">AIAnalysisPort</text>

  <!-- Domain -->
  <rect x="820" y="110" width="170" height="400" rx="10" class="domain" />
  <text x="840" y="140" class="section-title">Domain</text>
  <text x="840" y="180" class="box-title">Entities</text>
  <text x="840" y="205" class="small">LogEntry</text>
  <text x="840" y="225" class="small">ThreatAlert</text>
  <text x="840" y="245" class="small">AnalysisReport</text>

  <text x="840" y="280" class="box-title">Value Objects</text>
  <text x="840" y="305" class="small">Severity</text>

  <text x="840" y="340" class="box-title">Exceptions</text>
  <text x="840" y="365" class="small">DomainError</text>
  <text x="840" y="385" class="small">InvalidBatch</text>

  <!-- Infrastructure -->
  <rect x="1020" y="110" width="140" height="400" rx="10" class="infra" />
  <text x="1040" y="140" class="section-title">Infra</text>
  <text x="1040" y="180" class="box-title">PostgreSQL</text>
  <text x="1040" y="250" class="box-title">AWS S3</text>
  <text x="1040" y="320" class="box-title">Claude</text>
  <text x="1040" y="370" class="box-title">Object</text>
  <text x="1040" y="395" class="box-title">Storage</text>

  <!-- Workflow arrows -->
  <line x1="220" y1="270" x2="250" y2="270" class="arrow" />
  <line x1="500" y1="270" x2="535" y2="270" class="arrow" />
  <line x1="785" y1="270" x2="820" y2="270" class="arrow" />
  <line x1="990" y1="270" x2="1020" y2="270" class="arrow" />

  <!-- Grey footer -->
  <rect x="40" y="560" width="1120" height="110" rx="8" fill="#eef2f6" />
  <text x="60" y="590" class="section-title">Architecture principles</text>
  <text x="60" y="620" class="small">Hexagonal architecture: interface → application → domain</text>
  <text x="60" y="642" class="small">Adapters isolate database, cloud storage and AI provider concerns</text>
</svg>
